<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantifyWealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-4 space-y-4">

    <header class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">QuantifyWealth</h1>
        <p class="text-xs text-slate-400" id="subtitle">Intraday ORB · NSE</p>
      </div>
      <span id="modeBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-700">…</span>
    </header>

    <!-- alerts -->
    <div id="killBanner" class="hidden rounded-lg bg-red-900/60 border border-red-600 px-4 py-2 text-sm font-semibold">
      ⛔ Kill switch tripped — daily loss limit hit. No new entries today.
    </div>
    <div id="authBanner" class="hidden rounded-lg bg-amber-900/60 border border-amber-600 px-4 py-2 text-sm">
      🔑 Upstox not connected / token expired. <button onclick="connectUpstox()" class="underline font-semibold">Connect Upstox</button>
    </div>

    <!-- controls -->
    <div class="flex flex-wrap gap-2">
      <button onclick="connectUpstox()" class="px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold">Connect Upstox</button>
      <button onclick="startSession()" class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold">Start</button>
      <button onclick="stopSession()" class="px-3 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-sm font-semibold">Stop</button>
      <span id="runState" class="px-3 py-2 rounded-lg bg-slate-800 text-sm">idle</span>
    </div>

    <!-- P&L cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="rounded-xl bg-slate-900 p-3"><div class="text-xs text-slate-400">Equity</div><div id="equity" class="text-lg font-bold">—</div></div>
      <div class="rounded-xl bg-slate-900 p-3"><div class="text-xs text-slate-400">Realized P&L</div><div id="realized" class="text-lg font-bold">—</div></div>
      <div class="rounded-xl bg-slate-900 p-3"><div class="text-xs text-slate-400">Available</div><div id="available" class="text-lg font-bold">—</div></div>
      <div class="rounded-xl bg-slate-900 p-3"><div class="text-xs text-slate-400">Trades today</div><div id="numTrades" class="text-lg font-bold">—</div></div>
    </div>

    <!-- open positions -->
    <section class="rounded-xl bg-slate-900 p-3">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Open positions</h2>
      <div id="positions" class="text-sm text-slate-400">None</div>
    </section>

    <!-- track record -->
    <section class="rounded-xl bg-slate-900 p-3">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Paper track record</h2>
      <div id="track" class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm text-slate-400">Loading…</div>
    </section>

    <!-- trade log -->
    <section class="rounded-xl bg-slate-900 p-3">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Today's trades</h2>
      <div id="trades" class="text-sm text-slate-400">None yet</div>
    </section>

    <p class="text-[11px] text-slate-600 text-center pt-2" id="lastTick"></p>
  </div>

<script>
const fmt = (n) => (n === null || n === undefined) ? "—" : "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits: 0});
const pnlClass = (n) => n > 0 ? "text-emerald-400" : (n < 0 ? "text-rose-400" : "");

async function connectUpstox() {
  const r = await fetch("/api/auth/login"); const { url } = await r.json();
  window.open(url, "_blank");
}
async function startSession() {
  const r = await fetch("/api/session/start", { method: "POST" });
  if (!r.ok) alert((await r.json()).detail || "Could not start");
}
async function stopSession() { await fetch("/api/session/stop", { method: "POST" }); }

function render(s) {
  document.getElementById("modeBadge").textContent = (s.mode || "").toUpperCase();
  document.getElementById("modeBadge").className =
    "px-3 py-1 rounded-full text-xs font-semibold " + (s.mode === "live" ? "bg-rose-700" : "bg-emerald-700");
  document.getElementById("runState").textContent = s.running ? "running" : "idle";
  document.getElementById("equity").textContent = fmt(s.equity);
  const r = document.getElementById("realized");
  r.textContent = fmt(s.realized_pnl); r.className = "text-lg font-bold " + pnlClass(s.realized_pnl);
  document.getElementById("available").textContent = fmt(s.available);
  document.getElementById("numTrades").textContent = s.num_trades ?? "—";

  document.getElementById("killBanner").classList.toggle("hidden", !s.halted);
  document.getElementById("authBanner").classList.toggle("hidden", !(s.needs_reauth || s.authenticated === false));

  const pos = s.open_positions || [];
  document.getElementById("positions").innerHTML = pos.length === 0 ? "None" :
    pos.map(p => `<div class="flex justify-between border-b border-slate-800 py-1">
      <span>${p.side} <b>${p.symbol}</b> ×${p.qty} @ ${p.entry_price}</span>
      <span class="${pnlClass(p.unrealized)}">${fmt(p.unrealized)}</span></div>`).join("");

  if (s.last_tick) document.getElementById("lastTick").textContent = "last tick: " + new Date(s.last_tick).toLocaleTimeString();
}

async function refreshTrack() {
  const t = await (await fetch("/api/track-record")).json();
  document.getElementById("track").innerHTML = `
    <div><div class="text-xs text-slate-500">Days</div>${t.days}</div>
    <div><div class="text-xs text-slate-500">Net P&L</div><span class="${pnlClass(t.net_pnl)}">${fmt(t.net_pnl)}</span></div>
    <div><div class="text-xs text-slate-500">Win days</div>${t.win_days}/${t.days} (${t.win_day_rate}%)</div>
    <div><div class="text-xs text-slate-500">Max drawdown</div><span class="text-rose-400">${fmt(t.max_drawdown)}</span></div>
    <div><div class="text-xs text-slate-500">Avg/day</div>${fmt(t.avg_daily_pnl)}</div>
    <div><div class="text-xs text-slate-500">Best day</div><span class="text-emerald-400">${fmt(t.best_day)}</span></div>
    <div><div class="text-xs text-slate-500">Worst day</div><span class="text-rose-400">${fmt(t.worst_day)}</span></div>
    <div><div class="text-xs text-slate-500">Total trades</div>${t.total_trades}</div>`;
}
async function refreshTrades() {
  const rows = await (await fetch("/api/trades")).json();
  document.getElementById("trades").innerHTML = rows.length === 0 ? "None yet" :
    rows.slice().reverse().map(t => `<div class="flex justify-between border-b border-slate-800 py-1">
      <span>${t.side} <b>${t.symbol}</b> ×${t.qty} → ${t.reason}</span>
      <span class="${pnlClass(t.net_pnl)}">${fmt(t.net_pnl)}</span></div>`).join("");
}

// Live snapshot stream with auto-reconnect.
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (e) => { const s = JSON.parse(e.data); render(s); };
  ws.onclose = () => setTimeout(connectWS, 2000);
}
connectWS();
refreshTrack(); refreshTrades();
setInterval(() => { refreshTrack(); refreshTrades(); }, 5000);
</script>
</body>
</html>
